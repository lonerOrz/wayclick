version: 2

# Keep GitHub Actions pinned to current majors/minors and bump them
# automatically. We pin by major version in the workflows and let Dependabot
# raise PRs for upgrades (the practical, maintainable alternative to hand-managed
# 40-char SHAs for workflows that build on the live toolchain).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
