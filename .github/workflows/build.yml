name: Build WayClick

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload-artifacts:
        description: "Upload release binaries as workflow artifacts"
        type: boolean
        default: false

jobs:
  cargo:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libevdev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build
      - run: cargo build --release

      - name: Bundle default assets next to the binary
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifacts
        shell: bash
        run: |
          mkdir -p target/release/assets
          cp -r assets/default target/release/assets/default

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wayclick-${{ matrix.os }}
          path: |
            target/release/wayclick
            target/release/wayclick.exe
            target/release/assets/default

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix -L build .#packages.x86_64-linux.default
      - run: nix -L flake check

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifacts
        run: cp -L result/bin/wayclick wayclick-linux
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifacts
        with:
          name: wayclick-nix-linux
          path: wayclick-linux
