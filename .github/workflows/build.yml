name: Build WayClick

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix -L build .#packages.x86_64-linux.default
      - run: nix -L flake check
