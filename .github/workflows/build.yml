name: Build WayClick

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build-linux:
        description: "Build Linux x86_64 on ubuntu-latest and aarch64 on ubuntu-24.04-arm."
        type: boolean
        default: true
      build-windows:
        description: "Build Windows x86_64 on windows-latest and aarch64 on windows-11-arm."
        type: boolean
        default: true
      build-macos:
        description: "Build macOS x86_64 on macos-15-intel and aarch64 on macos-latest."
        type: boolean
        default: true
      upload-artifacts:
        description: "Upload release binaries as workflow artifacts."
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.0"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Turn dispatch inputs into the cargo build matrix.
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.resolve.outputs.include }}
    steps:
      - name: Resolve matrix from inputs
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BUILD_LINUX: ${{ inputs.build-linux }}
          BUILD_WINDOWS: ${{ inputs.build-windows }}
          BUILD_MACOS: ${{ inputs.build-macos }}
        run: |
          if [[ "${EVENT}" != "workflow_dispatch" ]]; then
            BUILD_LINUX=true
            BUILD_WINDOWS=true
            BUILD_MACOS=true
          fi

          include='[]'
          add() { include="$(echo "${include}" | jq --argjson item "$1" '. + [$item]')"; }

          # Use native runners; cross-compile only where GitHub offers no hosted runner.
          if [[ "${BUILD_LINUX}" == "true" ]]; then
            add '{"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-latest","os":"linux","bin_ext":""}'
            add '{"target":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","os":"linux","bin_ext":""}'
          fi
          if [[ "${BUILD_WINDOWS}" == "true" ]]; then
            add '{"target":"x86_64-pc-windows-msvc","runner":"windows-latest","os":"windows","bin_ext":".exe"}'
            add '{"target":"aarch64-pc-windows-msvc","runner":"windows-11-arm","os":"windows","bin_ext":".exe"}'
          fi
          if [[ "${BUILD_MACOS}" == "true" ]]; then
            add '{"target":"x86_64-apple-darwin","runner":"macos-15-intel","os":"macos","bin_ext":""}'
            add '{"target":"aarch64-apple-darwin","runner":"macos-latest","os":"macos","bin_ext":""}'
          fi

          {
            echo "include<<EOF"
            echo "${include}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: ${include}"

  build:
    name: Build (${{ matrix.target }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libevdev-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          staging="pkg/${{ matrix.os }}-${{ matrix.target }}"
          mkdir -p "${staging}/assets"
          cp "target/${{ matrix.target }}/release/wayclick${{ matrix.bin_ext }}" "${staging}/"
          cp -r assets/default "${staging}/assets/default"

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wayclick-${{ matrix.os }}-${{ matrix.target }}
          path: pkg/${{ matrix.os }}-${{ matrix.target }}
          if-no-files-found: error

  # Nix build and flake check for both Linux architectures. CI validation
  # only; not a release artifact.
  nix:
    name: Nix build & check (${{ matrix.system }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Build package
        run: nix -L build .#packages.${{ matrix.system }}.default

      - name: Flake check
        run: nix -L flake check

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifacts
        run: cp -L result/bin/wayclick wayclick-${{ matrix.system }}

      - name: Store artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wayclick-nix-${{ matrix.system }}
          path: wayclick-${{ matrix.system }}
          if-no-files-found: error
