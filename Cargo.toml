[package]
name = "wayclick"
version = "1.0.0"
edition = "2024"
description = "A lightweight cross-platform CLI application for triggering sound effects with keyboard and mouse input."
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/lonerOrz/wayclick"
keywords = ["audio", "sound", "keyboard", "mouse", "cross-platform"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
# Async runtime
tokio = {
    version = "1",
    default-features = false,
    features = [
        "macros",
        "rt-multi-thread",
        "signal",
        "time",
        "sync",
    ],
}

futures = "0.3"
tokio-stream = "0.1"

# Audio playback and decoding
rodio = {
    version = "0.23.0",
    default-features = false,
    features = ["playback", "hound"],
}

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

# Error handling and logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Random selection
rand = { version = "0.8", features = ["small_rng"] }

# CLI
clap = { version = "4", features = ["derive"] }


# Linux dependencies
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

evdev = {
    version = "0.13",
    features = ["tokio", "stream-trait"],
}


# Windows dependencies
[target.'cfg(windows)'.dependencies]
windows-sys = {
    version = "0.59",
    features = [
        "Win32_Foundation",
        "Win32_UI_WindowsAndMessaging",
        "Win32_System_LibraryLoader",
        "Win32_System_Threading",
    ],
}


# macOS dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

objc2-core-graphics = {
    version = "0.3",
    features = ["CGEvent", "CGEventTypes"],
}

objc2-core-foundation = {
    version = "0.3",
    features = ["CFMachPort", "CFRunLoop"],
}


# Development dependencies
[dev-dependencies]
tokio = {
    version = "1",
    default-features = false,
    features = [
        "macros",
        "rt-multi-thread",
        "signal",
        "time",
        "sync",
        "test-util",
    ],
}

criterion = "0.5"


# Benchmarks
[[bench]]
name = "dispatch"
harness = false


# Build profiles
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
